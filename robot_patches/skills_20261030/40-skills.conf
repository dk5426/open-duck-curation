# /etc/systemd/system/open-duck-runtime.service.d/40-skills.conf  (2026-10-30)
# Walker policy (same 101-in/14-out contract as BEST_WALK_ONNX_2; remove this line to go back to it),
# get-up policy and the button that starts a get-up.
[Service]
Environment=DUCK_ONNX_MODEL=ours_walker_full300M_258M.onnx
Environment=DUCK_GETUP_ONNX_MODEL=/home/duck/open_duck_mini_runtime/getup_real2_80M.onnx
Environment=DUCK_GETUP_BUTTON_INDEX=11
Environment=DUCK_ACTION_SCALE=0.25
Environment=DUCK_IMU_STANDING_ACC=-0.15,-4.22,7.94
Environment=DUCK_MIN_MOTOR_VOLTAGE=5.0
